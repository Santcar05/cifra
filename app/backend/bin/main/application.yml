spring:
  application:
    name: cifra-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/cifra
    username: cifra_app
    password: ${CIFRA_APP_PASSWORD:cifra_app_dev_local}
  flyway:
    user: cifra
    password: cifra_dev_local
    placeholders:
      app_password: ${CIFRA_APP_PASSWORD:cifra_app_dev_local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        path-segment: 1
      supported: '1'

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  shutdown: graceful

cifra:
  propietario:
    usuario: santiago
    clave: '{noop}cifra-dev-local'

spring:
  application:
    name: cifra-backend
  threads:
    virtual:
      enabled: true
  # Cada credencial se lee de una variable de entorno. El valor tras ':' es el de
  # desarrollo local (infra/docker-compose.yml) y nunca debe llegar a produccion.
  datasource:
    url: ${CIFRA_DB_URL:jdbc:postgresql://localhost:5432/cifra}
    username: cifra_app
    password: ${CIFRA_APP_PASSWORD:cifra_app_dev_local}
  flyway:
    user: ${CIFRA_FLYWAY_USER:cifra}
    password: ${CIFRA_FLYWAY_PASSWORD:cifra_dev_local}
    placeholders:
      app_password: ${CIFRA_APP_PASSWORD:cifra_app_dev_local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        path-segment: 1
      supported: '1'

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  shutdown: graceful

cifra:
  propietario:
    usuario: ${CIFRA_PROPIETARIO_USUARIO:santiago}
    clave: '${CIFRA_PROPIETARIO_CLAVE:{noop}cifra-dev-local}'

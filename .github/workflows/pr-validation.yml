name: pr-validation
# Comprobaciones que solo tienen sentido sobre una propuesta de cambio.
# Las pruebas de la landing y del backend viven en ci.yml, que tambien
# corre en cada pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio con toda su historia
        # gitleaks revisa cada commit del pull request, no solo el ultimo:
        # un secreto que se sube y se borra en el commit siguiente sigue
        # estando en la historia, y sigue filtrado.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Buscar secretos filtrados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
